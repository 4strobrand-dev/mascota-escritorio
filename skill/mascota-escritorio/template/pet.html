<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Mascota</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none;
    -webkit-user-select: none; font-family: "Segoe UI", -apple-system, system-ui, sans-serif; }
  #pet { position: absolute; left: 0; top: 0; width: 230px; height: 250px; cursor: pointer; touch-action: none; }
  #c { position: absolute; left: 0; top: 0; }
  #bubble { position: absolute; left: 50%; top: 6px; transform: translate(-50%, calc(-100% + 6px)) scale(.85);
    transform-origin: 50% 100%; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    background: #ffffff; color: #1d2230; font-size: 12.5px; font-weight: 600; line-height: 1.25;
    padding: 6px 11px; border-radius: 12px; width: max-content; max-width: 196px; text-align: center;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06); }
  #bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }

  /* --- Solo vista previa en navegador --- */
  body.preview { background: #2B3442; height: 100vh; }
  body.preview #desk { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: #1A1F28; }
  body.preview #hint { position: absolute; top: 14px; left: 0; right: 0; text-align: center;
    color: #C9D2DE; font-size: 13px; padding: 0 16px; line-height: 1.5; }
  body.preview #mockChat { position: absolute; background: #262624; color: #EDEBE6; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4); display: none; flex-direction: column; overflow: hidden; }
  body.preview #mockChat.open { display: flex; }
  #mockChat .bar { background: #1E1E1C; padding: 7px 8px; display: flex; gap: 4px; align-items: center; }
  #mockChat .tab { background: none; border: 0; color: #A9A69E; font: 600 12.5px inherit; padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-family: inherit; }
  #mockChat .tab.on { background: #34332F; color: #F4F2EC; }
  #mockChat .x { margin-left: auto; background: none; border: 0; color: #A9A69E; font-size: 18px; cursor: pointer; }
  #mockChat .view { display: none; flex: 1; flex-direction: column; }
  #mockChat .view.on { display: flex; }
  #mockChat .body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 12px; padding: 18px; text-align: center; font-size: 14px; }
  #mockChat .input { margin: 12px; border: 1px solid #3D3C38; border-radius: 12px; padding: 12px; color: #8D8A82; font-size: 13px; }
  #mockChat .song { font-size: 17px; font-weight: 700; }
  #mockChat .artist, #mockChat #mState { color: #A9A69E; font-size: 13px; }
  #mockChat .ctl { display: flex; gap: 14px; align-items: center; }
  #mockChat .ctl button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #34332F; color: #EDEBE6; font-size: 14px; cursor: pointer; }
  #mockChat .ctl #mPlay { width: 54px; height: 54px; background: #1DB954; color: #0B0B0B; font-size: 16px; }
  body.preview #acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  #acts button { background: #3A4556; color: #E9EEF5; border: 0; border-radius: 999px; padding: 7px 11px;
    font: 600 12px inherit; font-family: inherit; cursor: pointer; }
  #acts button:active { background: #4C5A70; }
  body:not(.preview) #acts, body:not(.preview) #desk, body:not(.preview) #hint, body:not(.preview) #mockChat { display: none; }
</style>
</head>
<body>
  <div id="hint">Vista previa · toca a la mascota para abrir el panel<br>arrástrala para moverla · rueda del mouse sobre ella = tamaño
  <div id="acts">
    <button data-a="dance">🕺 Bailar</button><button data-a="coffee">☕ Café</button>
    <button data-a="jetpack">🚀 Jetpack</button><button data-a="moonwalk">🌙 Moonwalk</button>
    <button data-a="slip">🍌 Resbalón</button><button data-a="stretch">🙆 Estirarse</button>
    <button data-a="sleep">💤 Dormir</button><button data-k="-0.1">− Tamaño</button><button data-k="0.1">+ Tamaño</button>
  </div>
  </div>
  <div id="desk"></div>
  <div id="mockChat">
    <div class="bar">
      <button class="tab on" data-tab="claude">✳ Claude</button>
      <button class="tab" data-tab="music">♫ Música</button>
      <button class="x" id="mockClose" aria-label="Cerrar">×</button>
    </div>
    <div class="view on" data-view="claude">
      <div class="body"><div style="font-size:22px">✳︎</div>
        <div>Aquí se abre <b>claude.ai</b> con tu cuenta,<br>tus proyectos y tu historial.</div></div>
      <div class="input">¿En qué te ayudo hoy?</div>
    </div>
    <div class="view" data-view="music">
      <div class="body">
        <div class="song">Canción de prueba</div><div class="artist">Mascota</div>
        <div class="ctl"><button>⏮</button><button id="mPlay">▶</button><button>⏭</button></div>
        <div id="mState">En pausa · dale play y mira a la mascota</div>
      </div>
    </div>
  </div>
  <div id="pet">
    <canvas id="c"></canvas>
    <div id="bubble"></div>
  </div>
  <script src="pet.config.js"></script>
  <script src="character.js"></script>
  <script src="engine.js"></script>
  <script src="pet.js"></script>
</body>
</html>
