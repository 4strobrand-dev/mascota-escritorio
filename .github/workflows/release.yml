# Al crear una etiqueta "v*": empaqueta la skill (.skill) y compila a Astro (ejemplo) para Windows y Mac.
name: Publicar skill y ejemplo

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar la skill
        run: cd skill && zip -qr ../mascota-escritorio.skill mascota-escritorio
      - uses: actions/upload-artifact@v4
        with: { name: skill, path: mascota-escritorio.skill }
      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: mascota-escritorio.skill }

  astro:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skill/mascota-escritorio/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Preparar
        run: |
          pip install pillow
          node tools/configure.js .
          python tools/icons.py .
      - run: npm install
      - name: Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Mac
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: astro-${{ runner.os }}
          path: |
            skill/mascota-escritorio/template/dist/*.exe
            skill/mascota-escritorio/template/dist/*.dmg
          if-no-files-found: ignore
      - name: Adjuntar al release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skill/mascota-escritorio/template/dist/*.exe
            skill/mascota-escritorio/template/dist/*.dmg
